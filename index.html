<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VB Stats">
<meta name="theme-color" content="#0E131D">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>VB Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E131D; --s1:#141B28; --s2:#182131; --s3:#222D40; --line:#2E3B52;
  --text:#EEF2F7; --soft:#C3CCD9; --muted:#9AA6B8;
  --plus:#4DA8FF; --plus-fg:#A9D4FF; --plus-bg:#132A44; --plus-bd:#1F4670;
  --minus:#FF9447; --minus-fg:#FFC197; --minus-bg:#3A2214; --minus-bd:#5E3519;
  --num:'Barlow Condensed',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4}
body{padding:env(safe-area-inset-top) 0 0}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--plus);outline-offset:2px}
a{color:var(--plus)}
#app{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
#app.noNav{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
h1{font-family:var(--num);font-weight:700;font-size:32px;line-height:1;margin:0}
h2{font-size:15px;font-weight:600;margin:0}
.muted{color:var(--muted)} .soft{color:var(--soft)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--s2);border-radius:14px;padding:14px}
.btn{height:48px;padding:0 16px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--plus);color:#06182B}
.btn-ghost{border:1px solid var(--line);background:var(--s2);color:var(--text)}
.btn-warn{background:var(--minus);color:#1A0E05}
.btn-sm{height:40px;padding:0 12px;font-size:14px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.45}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--s3);padding:0 12px;width:100%;color:var(--text)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.big{font-family:var(--num);font-weight:700;font-size:36px;line-height:1}
.chip{padding:6px 12px;border-radius:14px;background:var(--s2);color:var(--muted);font-size:13px}
.chip.on{background:var(--plus-bg);color:var(--plus-fg);font-weight:600}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--s3);color:var(--text)}

/* Live */
.tile{height:88px;border-radius:14px;border:2px solid var(--s3);background:var(--s2);padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:100%}
.tile[aria-pressed=true]{border-color:var(--plus);background:#16304D}
.tile .n{font-family:var(--num);font-weight:700;font-size:34px;line-height:1}
.tile .pm{font-family:var(--num);font-weight:700;font-size:20px}
.tile .nm{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad{background:var(--s1);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.padrow{display:flex;align-items:center;gap:8px}
.padrow .lb{width:52px;flex-shrink:0;font-size:13px;font-weight:600;color:var(--muted)}
.padrow .bs{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sb{height:52px;border-radius:10px;border:1px solid var(--line);background:var(--s3);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.sb .l{font-size:14px;font-weight:600;line-height:1.1} .sb .v{font-size:11px;opacity:.85}
.sb.p{background:var(--plus-bg);border-color:var(--plus-bd);color:var(--plus-fg)}
.sb.m{background:var(--minus-bg);border-color:var(--minus-bd);color:var(--minus-fg)}
.sb:active{transform:scale(.96)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--s2);border-radius:12px;padding:4px}
.stepper button{width:44px;height:44px;border-radius:9px;background:var(--s3);display:flex;align-items:center;justify-content:center}
.stepper span{min-width:56px;text-align:center;font-family:var(--num);font-size:20px;font-weight:700}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block}

/* Lists */
.li{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:12px;padding:6px 6px 6px 6px;min-height:56px}
.badge{width:44px;height:44px;border-radius:10px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:700;font-size:24px;flex-shrink:0}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:52px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sw span{width:44px;height:26px;border-radius:13px;background:#3A465C;display:flex;align-items:center;padding:3px;justify-content:flex-start}
.sw span i{width:20px;height:20px;border-radius:10px;background:var(--text);display:block}
.sw[aria-pressed=true] span{background:#2F7FD0;justify-content:flex-end}

/* Stats */
.bar{flex:1;height:10px;border-radius:5px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:10px;border-radius:5px;background:var(--minus)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:4px 4px 6px;border-bottom:1px solid var(--s3)}
.tbl td{text-align:right;padding:0 4px;height:44px;border-bottom:1px solid #1E2738}
.tbl th:nth-child(1),.tbl td:nth-child(1),.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td:nth-child(1){font-family:var(--num);font-weight:700;font-size:18px;width:34px}
.tblwrap{overflow-x:auto}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(14,19,29,.96);border-top:1px solid var(--s3);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
nav.tabs .in{max-width:560px;width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
nav.tabs button{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:500}
nav.tabs button[aria-current=page]{color:var(--plus);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--s3);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90vw;z-index:9;display:none}
textarea{font:inherit;font-size:16px;color:var(--text);border-radius:10px;border:1px solid var(--line);background:var(--s3);padding:10px 12px;width:100%;min-height:88px;resize:vertical}
.avatar{width:88px;height:88px;border-radius:16px;background:var(--s3) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:700;font-size:40px;flex-shrink:0;color:var(--muted)}
.badge.ph{background-size:cover;background-position:center}
.tile.ph{background-size:cover;background-position:center 25%}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
/* Player card */
.bcard{border-radius:20px;padding:10px;background:linear-gradient(160deg,#1F4670,#132A44 45%,#3A2214);}
.bcard .in{border-radius:14px;background:var(--s1);overflow:hidden}
.bphoto{position:relative;aspect-ratio:4/3.4;background:#16304D center 25%/cover no-repeat;display:flex;align-items:center;justify-content:center}
.bphoto .ghost{font-family:var(--num);font-weight:700;font-size:160px;color:rgba(169,212,255,.18);line-height:1}
.bphoto .no{position:absolute;right:12px;bottom:-22px;width:64px;height:64px;border-radius:16px;background:var(--minus);color:#1A0E05;font-family:var(--num);font-weight:700;font-size:36px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--s1)}
.bbody{padding:16px 14px 14px;display:flex;flex-direction:column;gap:10px}
.bname{font-family:var(--num);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em;padding-right:72px}
.bstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--s3);border-radius:12px;overflow:hidden}
.bstrip div{background:var(--s2);padding:10px 8px;display:flex;flex-direction:column;gap:2px;align-items:center}
.bstrip b{font-family:var(--num);font-size:26px;font-weight:700;line-height:1}
.bstrip span{font-size:12px;color:var(--muted)}
.tbl.plain td:nth-child(1){font-family:var(--body);font-weight:500;font-size:14px;width:auto;white-space:nowrap}
.tbl.plain th:nth-child(2),.tbl.plain td:nth-child(2){text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--soft);background:var(--s2);border-radius:14px}
@media (prefers-reduced-motion:reduce){.sb:active{transform:none}}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, serverTimestamp, Timestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// =====================================================================
// Firebase web config (project: vbstats-f14b9). Public by design;
// data access is controlled by firestore.rules.
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBqcySW1k_NghYMzJnGK7EyfDVIKJgZQQo",
  authDomain: "vbstats-f14b9.firebaseapp.com",
  projectId: "vbstats-f14b9",
  storageBucket: "vbstats-f14b9.firebasestorage.app",
  messagingSenderId: "350602303132",
  appId: "1:350602303132:web:3266544f88a974dca4ff59"
};
// =====================================================================

const $app = document.getElementById('app');
if (firebaseConfig.apiKey.startsWith('PASTE')) {
  $app.classList.add('noNav');
  $app.innerHTML = `<div class="stack" style="padding-top:40px"><h1>Almost ready</h1><p class="soft">Paste your Firebase web config into <b>index.html</b> where it says “PASTE YOUR FIREBASE WEB CONFIG HERE”, then reload.</p></div>`;
  throw new Error('Firebase config missing');
}

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = initializeFirestore(fb, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

// ---------- Stat definitions (same values as the requirements) ----------
const STATS = {
  ace:            { label:'Ace',     sub:'+1',       cat:'Serve',  pm: 1,   name:'Ace' },
  serviceError:   { label:'Error',   sub:'−1',       cat:'Serve',  pm:-1,   name:'Service error', err:true },
  serveInPlay:    { label:'In play', sub:'0',        cat:'Serve',  pm: 0,   name:'Serve in play' },
  passExcellent:  { label:'3',       sub:'Perfect',  cat:'Pass',   pm: 0,   name:'Pass 3', pass:3 },
  passGood:       { label:'2',       sub:'Good',     cat:'Pass',   pm: 0,   name:'Pass 2', pass:2 },
  passPlayable:   { label:'1',       sub:'Playable', cat:'Pass',   pm: 0,   name:'Pass 1', pass:1 },
  receptionError: { label:'0',       sub:'Error',    cat:'Pass',   pm: 0,   name:'Reception error', pass:0, err:true },
  assist:         { label:'Assist',  sub:'+1',       cat:'Set',    pm: 1,   name:'Assist' },
  setError:       { label:'Error',   sub:'−1',       cat:'Set',    pm:-1,   name:'Set error', err:true },
  kill:           { label:'Kill',    sub:'+1',       cat:'Attack', pm: 1,   name:'Kill' },
  attackError:    { label:'Error',   sub:'−1',       cat:'Attack', pm:-1,   name:'Attack error', err:true },
  attackAttempt:  { label:'Attempt', sub:'0',        cat:'Attack', pm: 0,   name:'Attack attempt' },
  blockSolo:      { label:'Solo',    sub:'+1',       cat:'Block',  pm: 1,   name:'Solo block' },
  blockAssist:    { label:'Assist',  sub:'+½',       cat:'Block',  pm: 0.5, name:'Block assist' },
  blockError:     { label:'Error',   sub:'−1',       cat:'Block',  pm:-1,   name:'Block error', err:true }
};
const PAD = [
  ['Serve',  ['ace','serviceError','serveInPlay']],
  ['Pass',   ['passExcellent','passGood','passPlayable','receptionError']],
  ['Set',    ['assist','setError']],
  ['Attack', ['kill','attackError','attackAttempt']],
  ['Block',  ['blockSolo','blockAssist','blockError']]
];
const POS = { OH:'Outside hitter', OPP:'Opposite', MB:'Middle blocker', S:'Setter', L:'Libero', DS:'Defensive specialist' };
const CATS = ['Serve','Pass','Set','Attack','Block'];

function statLine(evs) {
  const c = {}; for (const e of evs) c[e.type] = (c[e.type] || 0) + 1;
  const n = t => c[t] || 0;
  const K = n('kill'), AE = n('attackError'), TA = K + AE + n('attackAttempt');
  const SA = n('ace'), SE = n('serviceError'), TS = SA + SE + n('serveInPlay');
  const passN = n('passExcellent') + n('passGood') + n('passPlayable') + n('receptionError');
  const passSum = 3*n('passExcellent') + 2*n('passGood') + n('passPlayable');
  const BS = n('blockSolo'), BA = n('blockAssist');
  let pm = 0; const errs = {};
  for (const t in c) { if (!STATS[t]) continue; pm += STATS[t].pm * c[t]; if (STATS[t].err) errs[STATS[t].cat] = (errs[STATS[t].cat] || 0) + c[t]; }
  return { n, K, AE, TA, eff: K - AE, hitPct: TA ? (K - AE) / TA : null,
    SA, SE, TS, servePct: TS ? (TS - SE) / TS : null,
    passN, passRating: passN ? passSum / passN : null,
    AST: n('assist'), SETE: n('setError'), BS, BA, BE: n('blockError'),
    blocks: BS + 0.5*BA, pts: K + SA + BS + 0.5*BA, pm, errs };
}

// ---------- Formatting ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const num = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
const fmtPM = v => v > 0 ? '+' + num(v) : v < 0 ? '−' + num(Math.abs(v)) : '0';
const pmColor = v => v > 0 ? 'var(--plus)' : v < 0 ? 'var(--minus)' : 'var(--muted)';
const fmtHit = v => v == null ? '—' : (v < 0 ? '−' : '') + Math.abs(v).toFixed(3).replace(/^0/, '');
const fmtRate = v => v == null ? '—' : v.toFixed(2);
const fmtPct = v => v == null ? '—' : Math.round(v * 100) + '%';
const toDate = t => t?.toDate ? t.toDate() : (t instanceof Date ? t : null);
const fmtDate = t => { const d = toDate(t); return d ? d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) : ''; };
const ICON = {
  matches:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>',
  live:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3c3.5 3.5 3.5 14.5 0 18M4 8.5c5 2 11 2 16 0M4 15.5c5-2 11-2 16 0"></path></svg>',
  roster:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5M16 4.6a3.5 3.5 0 010 6.8M18 13.8c2 .8 3.5 3 3.5 6.2"></path></svg>',
  stats:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>',
  admin:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"></path></svg>',
  undo:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 010 10h-3"></path></svg>',
  left:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>',
  right:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>'
};

// ---------- State ----------
const S = {
  user: null, profile: null, authMode: 'signin', authBusy: false,
  teams: [], seasons: [], teamId: localStorage.getItem('teamId') || null,
  players: [], matches: [], view: 'matches',
  matchId: null, events: [], pending: false,
  set: 1, selected: null, lineup: [], subMode: false, undo: [],
  editPlayerId: null, showPlayerForm: false, showMatchForm: false,
  statsScope: 'match', statsSeasonId: null, seasonEvents: null, seasonLoading: false,
  coachNames: {}, freshForms: false,
  cardPlayerId: null, cardData: null, formPhoto: undefined
};
const unsub = { profile:null, teams:null, seasons:null, players:null, matches:null, events:null };
const off = k => { if (unsub[k]) { unsub[k](); unsub[k] = null; } };
const isAdmin = () => S.profile?.role === 'admin';
const team = () => S.teams.find(t => t.id === S.teamId);
const match = () => S.matches.find(m => m.id === S.matchId);
const activePlayers = () => S.players.filter(p => p.isActive).sort((a,b) => a.number - b.number);
const playerById = id => S.players.find(p => p.id === id);

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = 'none', 3200);
}
const fail = what => err => { console.error(err); toast(`${what} didn’t save: ${err.code === 'permission-denied' ? 'you don’t have access to do that' : (err.message || err)}`); };

// ---------- Auth & subscriptions ----------
onAuthStateChanged(auth, user => {
  S.user = user;
  ['profile','teams','seasons','players','matches','events'].forEach(off);
  S.profile = null; S.teams = []; S.players = []; S.matches = []; S.events = [];
  if (!user) { render(); return; }
  unsub.profile = onSnapshot(doc(db, 'users', user.uid), snap => {
    if (!snap.exists()) {
      if (snap.metadata.fromCache) return;

  S.selected = S.lineup[0] || null;

    S.events = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    .catch(fail('Stat'));

function undo() {

// ---------- CSV export ----------
function csvFor(events, title) {
  const H = ['Player','#','Pos','+/-','Pts','K','AE','TA','Hit Eff','Hit %','Aces','SE','Pass Att','Pass Rtg','Ast','Set Err','Blk Solo','Blk Ast','Blk Err'];
  const q = s => /[",\n]/.test(String(s)) ? `"${String(s).replace(/"/g, '""')}"` : String(s);
  const line = (name, numb, pos, s) => [q(name), numb, pos, num(s.pm), num(s.pts), s.K, s.AE, s.TA, s.eff,
    s.hitPct == null ? '' : s.hitPct.toFixed(3), s.SA, s.SE, s.passN, s.passRating == null ? '' : s.passRating.toFixed(2),
    s.AST, s.SETE, s.BS, s.BA, s.BE].join(',');
  const ids = [...new Set(events.map(e => e.playerId))];
  const rows = [q(title), H.join(',')];
  ids.map(id => playerById(id) || { id, name: 'Removed player', number: '', position: '' })
     .sort((a,b) => (a.number || 0) - (b.number || 0))
     .forEach(p => rows.push(line(p.name, p.number, p.position, statLine(events.filter(e => e.playerId === p.id)))));
  rows.push(line('TEAM', '', '', statLine(events)));
  return rows.join('\n');
}
async function exportCSV(events, title) {
  const name = title.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') + '.csv';
  const file = new File([csvFor(events, title)], name, { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- Photos (stored small in the player doc; no paid Storage needed) ----------
const photoOf = p => (p && typeof p.photo === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p.photo)) ? p.photo : null;
async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h);
    const sx = (w - side) / 2, sy = h > w ? (h - side) * 0.2 : 0;   // portrait: keep the head in frame
    const c = document.createElement('canvas'); c.width = c.height = 360;
    c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, 360, 360);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}

      <div class="card"><h2 style="margin-bottom:8px">By season</h2><div class="tblwrap"><table class="tbl plain">
        <thead><tr><th>Season</th><th>M</th><th>+/−</th><th>Pts</th><th>K</th><th>Hit</th><th>Pass</th><th>Ace</th><th>Ast</th><th>Blk</th></tr></thead><tbody>
        ${seasonRows.map(r => `<tr><td>${esc(r.name)}</td><td>${r.gp}</td><td style="font-weight:700;color:${pmColor(r.s.pm)}">${fmtPM(r.s.pm)}</td><td>${num(r.s.pts)}</td><td>${r.s.K}</td><td>${fmtHit(r.s.hitPct)}</td><td>${fmtRate(r.s.passRating)}</td><td>${r.s.SA}</td><td>${r.s.AST}</td><td>${num(r.s.blocks)}</td></tr>`).join('')}
        ${seasonRows.length > 1 ? `<tr><td style="font-weight:700">Career</td><td>${d.length}</td><td style="font-weight:700;color:${pmColor(all.pm)}">${fmtPM(all.pm)}</td><td>${num(all.pts)}</td><td>${all.K}</td><td>${fmtHit(all.hitPct)}</td><td>${fmtRate(all.passRating)}</td><td>${all.SA}</td><td>${all.AST}</td><td>${num(all.blocks)}</td></tr>` : ''}
      </tbody></table></div></div>
      <div class="card"><h2 style="margin-bottom:8px">Game log</h2><div class="tblwrap"><table class="tbl plain">
        <thead><tr><th>Match</th><th>+/−</th><th>Pts</th><th>K</th><th>E</th><th>Hit</th><th>Pass</th><th>Ace</th><th>Blk</th></tr></thead><tbody>
        ${games.map(r => { const g = statLine(r.evs); return `<tr><td><button data-act="openFromCard" data-id="${r.m.id}" style="text-align:left;min-height:44px;color:var(--text)"><div class="ell" style="max-width:120px">vs ${esc(r.m.opponent)}</div><div class="small muted">${shortDate(r.m.date)}</div></button></td><td style="font-weight:700;color:${pmColor(g.pm)}">${fmtPM(g.pm)}</td><td>${num(g.pts)}</td><td>${g.K}</td><td>${g.AE}</td><td>${fmtHit(g.hitPct)}</td><td>${fmtRate(g.passRating)}</td><td>${g.SA}</td><td>${num(g.blocks)}</td></tr>`; }).join('')}
      </tbody></table></div></div>`;
    S._cardTotals = all;
  }
  const t = d && d.length ? statLine(d.flatMap(r => r.evs)) : null;
  const strip = [['+/−', t ? fmtPM(t.pm) : '—', t ? pmColor(t.pm) : ''], ['Points', t ? num(t.pts) : '—'], ['Kills', t ? t.K : '—'],
                 ['Hit %', t ? fmtHit(t.hitPct) : '—'], ['Pass', t ? fmtRate(t.passRating) : '—'], ['Aces', t ? t.SA : '—']];
  return `<div class="row between" style="margin-bottom:12px">
      <button class="btn btn-ghost btn-sm" data-act="go" data-v="roster">${ICON.left}Roster</button>
      <button class="btn btn-ghost btn-sm" data-act="editPlayer" data-id="${p.id}">Edit</button>
    </div>
    <div class="stack">
      <div class="bcard"><div class="in">
        <div class="bphoto" style="${ph ? `background-image:url(${ph})` : ''}">${ph ? '' : `<span class="ghost">${p.number}</span>`}<div class="no">${p.number}</div></div>
        <div class="bbody">
          <div class="bname">${esc(p.name)}</div>
          <div class="small soft">${esc(bio) || 'Add grad year, height, and more with Edit.'}</div>
          <div class="small muted">${esc(team()?.name || '')}${d && d.length ? `, ${d.length} match${d.length === 1 ? '' : 'es'} played` : ''}${p.isActive ? '' : ', inactive'}</div>
          <div class="bstrip">${strip.map(([l, v, c]) => `<div><b style="${c ? 'color:' + c : ''}">${v}</b><span>${l}</span></div>`).join('')}</div>
        </div>
      </div></div>
      ${body}
      ${p.notes ? `<div class="card stack" style="gap:6px"><h2>Coach notes</h2><div class="soft" style="white-space:pre-wrap">${esc(p.notes)}</div></div>` : ''}
    </div>`;
}

function viewStats() {
  const seasonMode = S.statsScope === 'season';
  let evs, title, body = '';
  const seg = `<div class="seg" style="margin-bottom:12px"><button aria-pressed="${!seasonMode}" data-act="scope" data-v="match">This match</button><button aria-pressed="${seasonMode}" data-act="scope" data-v="season">Season</button></div>`;
  if (seasonMode) {
    const seasons = S.seasons;
    if (!seasons.length) return `${header('Stats')}${seg}<div class="empty">No seasons yet. An administrator can create one in Admin.</div>`;
    const sid = S.statsSeasonId || (seasons.find(s => s.isCurrent) || seasons[0]).id;
    if (S.statsSeasonId !== sid && !S.seasonLoading) { queueMicrotask(() => loadSeason(sid)); }
    const picker = `<label class="f" style="margin-bottom:12px">Season<select data-act="pickSeason">${seasons.map(s => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>`;
    if (S.seasonLoading || !S.seasonEvents) return `${header('Stats')}${seg}${picker}<div class="empty">Loading season stats…</div>`;
    evs = S.seasonEvents; title = `${team()?.name || 'Team'} ${seasons.find(s => s.id === sid)?.name || ''} season`;
    body = picker;
  } else {
    const m = match() || S.matches[0];
    if (!m) return `${header('Stats')}${seg}<div class="empty">No matches yet.</div>`;
    if (!match()) { queueMicrotask(() => openMatchQuiet(m.id)); return `${header('Stats')}${seg}<div class="empty">Loading…</div>`; }
    evs = S.events; title = `vs ${m.opponent} ${fmtDate(m.date)}`;
    body = `<div class="small muted" style="margin-bottom:12px">vs ${esc(m.opponent)}, ${fmtDate(m.date)}</div>`;
  }
  const s = statLine(evs);
  const maxErr = Math.max(1, ...CATS.map(c => s.errs[c] || 0));
  const errTotal = CATS.reduce((a, c) => a + (s.errs[c] || 0), 0);
  const ids = [...new Set(evs.map(e => e.playerId))];
  const rows = ids.map(id => { const p = playerById(id) || { name: 'Removed player', number: '' }; return { p, s: statLine(evs.filter(e => e.playerId === id)) }; })
    .sort((a, b) => b.s.pm - a.s.pm);
  return `${header('Stats')}${seg}${body}<div class="stack">
    <button class="btn btn-ghost btn-block" data-act="csv" ${evs.length ? '' : 'disabled'}>Export CSV</button>
    <div class="grid2">
      <div class="card stack" style="gap:4px"><span class="small muted">Hitting</span><span class="big">${fmtHit(s.hitPct)}</span><span class="small soft">${s.K} K, ${s.AE} E, ${s.TA} TA</span><span class="small" style="color:var(--plus-fg)">Efficiency ${fmtPM(s.eff)}</span></div>
      <div class="card stack" style="gap:4px"><span class="small muted">Passing</span><span class="big">${fmtRate(s.passRating)}</span><span class="small soft">${s.passN} attempts</span><span class="small soft">3s ${s.n('passExcellent')}, 2s ${s.n('passGood')}, 1s ${s.n('passPlayable')}, 0s ${s.n('receptionError')}</span></div>
      <div class="card stack" style="gap:4px"><span class="small muted">Serving</span><span class="big">${fmtPct(s.servePct)}</span><span class="small soft">${s.SA} aces, ${s.SE} errors</span><span class="small soft">${s.TS} serves</span></div>
      <div class="card stack" style="gap:4px"><span class="small muted">Blocking</span><span class="big">${num(s.blocks)}</span><span class="small soft">${s.BS} solo, ${s.BA} assists</span><span class="small" style="color:var(--minus-fg)">${s.BE} block errors</span></div>
    </div>
    <div class="card stack" style="gap:10px">
      <div class="row between"><h2>Errors by category</h2><span class="small muted">${errTotal} total</span></div>
      ${CATS.map(c => `<div class="row"><span class="small soft" style="width:56px">${c}</span><span class="bar"><i style="width:${Math.round((s.errs[c] || 0) / maxErr * 100)}%"></i></span><span class="small" style="width:24px;text-align:right;font-weight:600">${s.errs[c] || 0}</span></div>`).join('')}
    </div>
    <div class="card">
      <div class="row between" style="margin-bottom:6px"><h2>Players</h2><span class="small muted">Sorted by +/−</span></div>
      ${rows.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>#</th><th>Player</th><th>+/−</th><th>Pts</th><th>K</th><th>Hit</th><th>Pass</th><th>Ace</th><th>Ast</th><th>Blk</th></tr></thead><tbody>
        ${rows.map(({ p, s }) => `<tr><td>${p.number}</td><td class="ell" style="max-width:110px">${esc(p.name)}</td><td style="font-weight:700;color:${pmColor(s.pm)}">${fmtPM(s.pm)}</td><td>${num(s.pts)}</td><td>${s.K}</td><td>${fmtHit(s.hitPct)}</td><td>${fmtRate(s.passRating)}</td><td>${s.SA}</td><td>${s.AST}</td><td>${num(s.blocks)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="muted small">No stats entered yet.</div>`}
    </div>
  </div>`;
}
function openMatchQuiet(id) { openMatch(id, true); }

function viewAdmin() {
  const t = team();
  const today = new Date().toISOString().slice(0, 10);
  return `${header('Admin')}<div class="stack">
    <form data-form="team" class="card stack"><h2>Create team</h2>
      <label class="f">Team name<input id="t-name" type="text" required></label>
      <button class="btn btn-primary">Create team</button></form>
    ${t ? `<form data-form="coach" class="card stack"><h2>Coaches on ${esc(t.name)}</h2>
      ${(t.coachIds || []).map(uid => `<div class="row between"><span class="ell">${esc(S.coachNames[uid] || '…')}${uid === S.user.uid ? ' (you)' : ''}</span>${uid === S.user.uid ? '' : `<button type="button" class="btn btn-ghost btn-sm" data-act="removeCoach" data-id="${uid}">Remove</button>`}</div>`).join('') || '<span class="muted small">No coaches yet.</span>'}
      <label class="f">Add coach by email<input id="c-email" type="email" placeholder="They must create an account first" required></label>
      <button class="btn btn-primary">Add coach</button></form>` : ''}
    <form data-form="season" class="card stack"><h2>Seasons</h2>
      ${S.seasons.map(s => `<div class="row between"><span>${esc(s.name)}</span>${s.isCurrent ? '<span class="chip on">Current</span>' : `<button type="button" class="btn btn-ghost btn-sm" data-act="makeCurrent" data-id="${s.id}">Make current</button>`}</div>`).join('') || '<span class="muted small">No seasons yet.</span>'}
      <div class="grid2"><label class="f">New season<input id="s-name" type="text" placeholder="Fall 2026" required></label><label class="f">Start date<input id="s-date" type="date" value="${today}"></label></div>
      <button class="btn btn-primary">Create season</button></form>
    <div class="card stack"><h2>Account</h2><span class="small soft">${esc(S.user.email)}, administrator</span>
      <button class="btn btn-ghost" data-act="signout">Sign out</button></div>
  </div>`;
}

function nav() {
  const tabs = [['matches','Matches'],['live','Live'],['roster','Roster'],['stats','Stats']];
  tabs.push(isAdmin() ? ['admin','Admin'] : ['account','Account']);
  return `<nav class="tabs" aria-label="Main"><div class="in">${tabs.map(([k, l]) =>
    `<button data-act="go" data-v="${k}" ${S.view === k || (k === 'roster' && S.view === 'player') ? 'aria-current="page"' : ''}>${ICON[k] || ICON.admin}${l}</button>`).join('')}</div></nav>`;
}
function viewAccount() {
  return `${header('Account')}<div class="card stack"><span>${esc(S.profile?.name || '')}</span><span class="small soft">${esc(S.user.email)}, head coach</span>
    <button class="btn btn-ghost" data-act="signout">Sign out</button></div>`;
}

function render() {
  const saved = {}; let focusId = document.activeElement?.id;
  if (!S.freshForms) $app.querySelectorAll('input[id]:not([type=file]),select[id],textarea[id]').forEach(el => saved[el.id] = el.value);
  S.freshForms = false;
  let html;
  if (!S.user) { html = viewAuth(); $app.classList.add('noNav'); }
  else if (!S.profile) { html = `<div class="empty" style="margin-top:40px">Loading…</div>`; $app.classList.add('noNav'); }
  else if (!S.teamId && S.view !== 'admin' && S.view !== 'account') { html = viewNoTeam() + nav(); $app.classList.remove('noNav'); }
  else {
    $app.classList.remove('noNav');
    html = ({ matches: viewMatches, live: viewLive, roster: viewRoster, player: viewCard, stats: viewStats, admin: viewAdmin, account: viewAccount }[S.view] || viewMatches)() + nav();
  }
  $app.innerHTML = html;
  for (const id in saved) { const el = document.getElementById(id); if (el) el.value = saved[id]; }
  if (focusId) document.getElementById(focusId)?.focus({ preventScroll: true });
}

// ---------- Events ----------
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  const a = el.dataset.act, id = el.dataset.id;
  const tid = S.teamId;
  switch (a) {
    case 'toggleAuth': S.authMode = S.authMode === 'signin' ? 'signup' : 'signin'; S.freshForms = true; render(); break;
    case 'reset': { const em = document.getElementById('au-email').value.trim(); if (!em) { toast('Enter your email first'); break; }
      sendPasswordResetEmail(auth, em).then(() => toast('Password reset email sent')).catch(err => toast(err.message)); break; }
    case 'signout': closeMatch(); signOut(auth); break;
    case 'go': S.view = el.dataset.v; if (S.view === 'admin') loadCoachNames(); window.scrollTo(0, 0); render(); break;
    case 'newMatch': S.showMatchForm = true; S.freshForms = true; render(); document.getElementById('m-opp')?.focus(); break;
    case 'cancelMatch': S.showMatchForm = false; render(); break;
    case 'open': openMatch(id); window.scrollTo(0, 0); break;
    case 'pick': S.selected = id; render(); break;
    case 'stat': record(el.dataset.t); break;
    case 'undo': undo(); break;
    case 'setDown': S.set = Math.max(1, S.set - 1); localStorage.setItem('set:' + S.matchId, S.set); render(); break;
    case 'setUp': S.set = Math.min(5, S.set + 1); localStorage.setItem('set:' + S.matchId, S.set); render(); break;
    case 'sub': S.subMode = !S.subMode; render(); break;
    case 'toggleLineup': S.lineup = S.lineup.includes(id) ? S.lineup.filter(x => x !== id) : [...S.lineup, id]; render(); break;
    case 'subDone':
      S.subMode = false; localStorage.setItem('lineup:' + S.matchId, JSON.stringify(S.lineup));
      if (!S.lineup.includes(S.selected)) S.selected = S.lineup[0] || null; render(); break;
    case 'final': if (confirm('End this match? You can reopen it later.')) updateDoc(doc(db, 'teams', tid, 'matches', S.matchId), { status: 'final' }).catch(fail('Match')); break;
    case 'reopen': updateDoc(doc(db, 'teams', tid, 'matches', S.matchId), { status: 'live' }).catch(fail('Match')); break;
    case 'card': openCard(id); break;
    case 'openFromCard': openMatch(id); window.scrollTo(0, 0); break;
    case 'removePhoto': S.formPhoto = null; render(); break;
    case 'addPlayer': S.formPhoto = undefined; S.view = 'roster'; S.editPlayerId = null; S.showPlayerForm = true; S.freshForms = true; render(); document.getElementById('p-name')?.focus(); break;
    case 'editPlayer': S.formPhoto = undefined; S.editPlayerId = id; S.showPlayerForm = true; S.freshForms = true; render(); window.scrollTo(0, 0); break;
    case 'cancelPlayer': S.showPlayerForm = false; S.editPlayerId = null; S.formPhoto = undefined; render(); break;
    case 'toggleActive': { const p = playerById(id); updateDoc(doc(db, 'teams', tid, 'players', id), { isActive: !p.isActive }).catch(fail('Player')); break; }
    case 'deletePlayer': if (confirm('Delete this player? Their past stats stay in team totals. Making them inactive is usually better.')) {
      deleteDoc(doc(db, 'teams', tid, 'players', id)).catch(fail('Player')); S.showPlayerForm = false; S.editPlayerId = null; render(); } break;
    case 'scope': S.statsScope = el.dataset.v; render(); break;
    case 'csv': {
      const season = S.statsScope === 'season';
      const m = match();
      const title = season ? `${team()?.name || 'Team'} ${S.seasons.find(s => s.id === S.statsSeasonId)?.name || ''} season` : `vs ${m?.opponent || ''} ${fmtDate(m?.date)}`;
      exportCSV(season ? S.seasonEvents || [] : S.events, title); break; }
    case 'removeCoach': if (confirm('Remove this coach from the team?')) updateDoc(doc(db, 'teams', tid), { coachIds: arrayRemove(id) }).catch(fail('Coach')); break;
    case 'makeCurrent':
      for (const s of S.seasons) updateDoc(doc(db, 'seasons', s.id), { isCurrent: s.id === id }).catch(fail('Season'));
      break;
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'team') { selectTeam(el.value); }
  if (el.dataset.act === 'pickSeason') { loadSeason(el.value); }
  if (el.dataset.act === 'photo' && el.files && el.files[0]) {
    shrinkPhoto(el.files[0]).then(d => { S.formPhoto = d; render(); }).catch(() => toast('That photo couldn’t be read. Try a JPG or PNG.'));
  }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target.dataset.form, v = id => document.getElementById(id)?.value.trim();
  try {
    if (f === 'auth') {
      S.authBusy = true; render();
      const em = v('au-email'), pw = document.getElementById('au-pass').value;
      try {
        if (S.authMode === 'signup') { S.pendingName = v('au-name'); await createUserWithEmailAndPassword(auth, em, pw); }
        else await signInWithEmailAndPassword(auth, em, pw);
      } catch (err) {
        const map = { 'auth/invalid-credential': 'Email or password is incorrect', 'auth/email-already-in-use': 'That email already has an account. Sign in instead.', 'auth/weak-password': 'Use at least 6 characters for the password' };
        toast(map[err.code] || err.message);
      }
      S.authBusy = false; render(); return;
    }
    if (f === 'match') {
      const ref = doc(collection(db, 'teams', S.teamId, 'matches'));
      const d = new Date(v('m-date') + 'T12:00:00');
      setDoc(ref, { opponent: v('m-opp'), date: Timestamp.fromDate(d), location: v('m-loc') || '', seasonId: v('m-season') || '', status: 'scheduled' }).catch(fail('Match'));
      S.showMatchForm = false; S.freshForms = true; render(); return;
    }
    if (f === 'player') {
      const gy = v('p-grad');
      const data = { name: v('p-name'), number: Number(v('p-num')), position: v('p-pos'), secondaryPosition: v('p-pos2') || '',
        hand: v('p-hand') || '', gradYear: gy ? Number(gy) : null, height: v('p-height') || '', notes: v('p-notes') || '' };
      if (S.formPhoto !== undefined) data.photo = S.formPhoto;
      if (S.players.some(p => p.number === data.number && p.id !== S.editPlayerId && p.isActive)) { toast(`#${data.number} is already taken by an active player`); return; }
      if (S.editPlayerId) updateDoc(doc(db, 'teams', S.teamId, 'players', S.editPlayerId), data).catch(fail('Player'));
      else addDoc(collection(db, 'teams', S.teamId, 'players'), { ...data, isActive: true }).catch(fail('Player'));
      toast(S.editPlayerId ? 'Player saved' : `${data.name} added`);
      const back = S.view === 'player' ? S.editPlayerId : null;
      S.editPlayerId = null; S.showPlayerForm = false; S.formPhoto = undefined; S.freshForms = true;
      if (back) S.cardPlayerId = back;
      render(); return;
    }
    if (f === 'team') {
      const ref = await addDoc(collection(db, 'teams'), { name: v('t-name'), coachIds: [S.user.uid], createdAt: Timestamp.now() });
      toast('Team created'); S.freshForms = true; selectTeam(ref.id); return;
    }
    if (f === 'coach') {
      const em = v('c-email').toLowerCase();
      const r = await getDocs(query(collection(db, 'users'), where('email', '==', em)));
      if (r.empty) { toast('No account with that email. Ask the coach to create one first.'); return; }
      await updateDoc(doc(db, 'teams', S.teamId), { coachIds: arrayUnion(r.docs[0].id) });
      S.coachNames[r.docs[0].id] = r.docs[0].data().name || em;
      toast('Coach added'); S.freshForms = true; render(); return;
    }
    if (f === 'season') {
      const first = !S.seasons.length;
      const d = v('s-date') ? new Date(v('s-date') + 'T12:00:00') : new Date();
      await addDoc(collection(db, 'seasons'), { name: v('s-name'), startDate: Timestamp.fromDate(d), isCurrent: first });
      toast('Season created'); S.freshForms = true; render(); return;
    }
  } catch (err) { fail('That')(err); }
});

window.addEventListener('online', render);
window.addEventListener('offline', render);
render();
</script>
</body>
</html>
